name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          BIN="fleeting-plugin-proxmox"
          OUT="${BIN}-${GOOS}-${GOARCH}"
          make clean
          make build
          mv "dist/${BIN}" "dist/${OUT}"
          go version -m "dist/${OUT}" | grep -Fx $'\tbuild\tGOOS='"${GOOS}"
          go version -m "dist/${OUT}" | grep -Fx $'\tbuild\tGOARCH='"${GOARCH}"
          cd dist
          sha256sum "${OUT}" > "${OUT}.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify release assets
        working-directory: dist
        run: |
          for arch in amd64 arm64; do
            test -s "fleeting-plugin-proxmox-linux-${arch}"
            sha256sum --check "fleeting-plugin-proxmox-linux-${arch}.sha256"
          done

      - name: Upload assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            if [ "$draft" != true ]; then
              echo "Release $GITHUB_REF_NAME is already published; use a new version tag."
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/fleeting-plugin-proxmox-linux-* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
